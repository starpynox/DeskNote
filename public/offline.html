<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>DeskNote — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1117;
        color: #edeef2;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 320px;
      }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: rgba(245, 166, 35, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 24px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #aeb2c2;
        line-height: 1.5;
        margin: 0;
      }
      a {
        display: inline-block;
        margin-top: 20px;
        background: #f5a623;
        color: #0f1117;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">📴</div>
      <h1>You're offline</h1>
      <p>
        DeskNote couldn't reach the network. Anything you've already opened, like your quizzes,
        notes and snippets, is still saved on this device.
      </p>
      <a href="/">Back to Dashboard</a>
    </div>
  </body>
</html>
